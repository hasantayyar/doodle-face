name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version"
            exit 1
          fi

      - run: npm test
      - run: npm run size
      - run: npm pack

      - name: Zip the library sources
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          mkdir -p dist
          cp "doodle-face-${version}.tgz" dist/
          (cd src && zip -r "../dist/doodle-face-${version}-src.zip" .)

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          gh release create "$GITHUB_REF_NAME" \
            --title "doodle-face v${version}" \
            --generate-notes \
            "dist/doodle-face-${version}.tgz" \
            "dist/doodle-face-${version}-src.zip"
