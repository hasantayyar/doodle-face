<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doodle-face</title>
<style>
  :root {
    --paper: #faf8f4;
    --card: #fff;
    --ink: #1a1a1a;
    --line: #e8e4dc;
    --muted: #8b8578;
    --accent: #2f6f5e;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  code, .mono, input[type=text] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 12px;
    padding: 22px 24px 14px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }

  main {
    display: grid;
    grid-template-columns: minmax(300px, 380px) 1fr;
    gap: 24px;
    align-items: start;
    padding: 24px;
    max-width: 1240px;
  }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }

  /* ---- stage ---- */
  #stage {
    position: sticky;
    top: 24px;
    display: grid;
    gap: 12px;
  }
  #portrait {
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    padding: 8px;
    color: var(--ink);
  }
  #portrait svg { width: 100%; height: 100%; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 0 0 auto; }
  .grow { flex: 1 1 120px; min-width: 0; }

  button, input[type=text] {
    font: inherit;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--card);
    color: var(--ink);
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  input[type=text] { width: 100%; font-size: 13px; }
  input[type=text]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  label.field { display: grid; gap: 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  #code { color: var(--muted); font-size: 11px; word-break: break-all; }

  /* ---- controls ---- */
  h2 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
  }
  .panels { display: grid; gap: 14px; }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

  .slider { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px; padding: 1px 0; }
  .slider span { font-size: 11.5px; color: var(--muted); }
  .slider input { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
  .slider b { font-size: 10.5px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- family ---- */
  .family { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .thumb {
    display: grid;
    place-items: center;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    aspect-ratio: 1;
  }
  .thumb:hover { border-color: var(--accent); }
  .thumb svg { width: 100%; height: 100%; }
  .parents {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 124px));
    justify-content: start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .parent { display: grid; gap: 6px; }
  .parent button:not(.thumb) { font-size: 12px; padding: 5px 6px; }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>doodle-face</h1>
  <p>Any string becomes a hand-drawn face. No dependencies, no assets, SVG out.</p>
  <nav>
    <a href="https://github.com/hasan-tayyar-besik/doodle-face">GitHub</a>
    <a href="https://github.com/hasan-tayyar-besik/doodle-face/releases">Releases</a>
  </nav>
</header>

<main>
  <section id="stage">
    <div class="card" id="portrait"></div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <label class="field grow">
          Seed
          <input type="text" id="seed" value="maya" spellcheck="false" autocomplete="off">
        </label>
      </div>
      <div class="row">
        <button class="primary" id="random">Random</button>
        <button id="nudge">Nudge</button>
        <button id="replay">Draw it</button>
        <button id="alive" aria-pressed="false">Alive</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="copySvg">Copy SVG</button>
        <button id="copyLink">Copy link</button>
        <button id="download">Download</button>
      </div>
      <p id="code" class="mono" style="margin:10px 0 0"></p>
    </div>
  </section>

  <section class="panels">
    <div class="card">
      <h2>Expression:<span style="text-transform:none;letter-spacing:0"> same face, different mood</span></h2>
      <div class="groups" id="expression"></div>
      <div class="row" style="margin-top:10px">
        <button id="resetExpression">Back to resting</button>
      </div>
    </div>

    <div class="card">
      <h2>Genes</h2>
      <div class="groups" id="genes"></div>
    </div>

    <div class="card">
      <h2>Breeding</h2>
      <p class="hint">Two faces make a child. Click any child to make it the face above.</p>
      <div class="parents">
        <div class="parent">
          <button class="thumb" id="parentA" title="Load this parent into the stage"></button>
          <button data-parent="a">Use current face</button>
        </div>
        <div class="parent">
          <button class="thumb" id="parentB" title="Load this parent into the stage"></button>
          <button data-parent="b">Use current face</button>
        </div>
      </div>
      <div class="family" id="children"></div>
    </div>
  </section>
</main>

<script type="importmap">
{
  "imports": {
    "doodle-face": "../src/index.js"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
